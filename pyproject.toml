[project]
name = "owners-obsolets"
version = "0.1.0"
description = "Oracle obsolete schema analysis dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.34",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "plotly>=5.20",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "oracledb>=2.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
